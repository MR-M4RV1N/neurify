Ordinary trials.Text.: Это обычные испытания — важные шаги повседневной жизни. Они не всегда запоминаются, но именно из них формируется путь.
Memorable trials.Text.: Это запоминающиеся испытания. Ты сделал чуть больше, чем обычно, и этот момент уже выделяется среди других.
Difficult trials.Text.: Это запоминающиеся и сложные испытания. Они потребовали усилий, концентрации и выхода из зоны комфорта.
Jump above the head.Text.: Здесь ты прыгнул выше своей головы. Это редкие моменты, когда ты превзошёл собственные ожидания и изменил траекторию своего пути.
